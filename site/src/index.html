<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0f" />
    <title>Nameforge — invent names from dead authors</title>
    <meta
      name="description"
      content="Pick authors, get names nobody has ever used. Built from 63 classic books plus Lovecraft, Asimov and Philip K. Dick."
    />
    <link rel="stylesheet" href="./style.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔮</text></svg>"
    />
  </head>
  <body>
    <div id="boot" class="boot">
      <div class="boot-mark">✦</div>
      <div class="boot-text">summoning the dead authors…</div>
      <div class="boot-bar"><i></i></div>
    </div>

    <main id="app" hidden>
      <header class="top">
        <h1>NAMEFORGE</h1>
        <button id="keptBtn" class="ghost" type="button">
          ★ <span id="keptCount">0</span>
        </button>
      </header>

      <section class="recipe">
        <div class="setgroup yes">
          <div class="setname"><span class="num">1</span> INCLUDE</div>
          <div class="seg" id="modeSeg">
            <button type="button" data-mode="all" class="on">∩ INTERSECTION</button>
            <button type="button" data-mode="any">∪ UNION</button>
          </div>
          <p class="gloss" id="incGloss">only words <b>every</b> one of these authors used</p>

          <div id="incPills" class="pills"></div>
        </div>

        <div class="setgroup no">
          <div class="setname"><span class="num">2</span> DIFFERENCE ∖ <span class="muted">exclude authors</span></div>
          <p class="gloss">their words are <b>subtracted</b> from the set above</p>
          <div id="excPills" class="pills"></div>
        </div>

        <div class="setgroup no">
          <div class="setname"><span class="num">3</span> DIFFERENCE ∖ <span class="muted">common English</span></div>
          <p class="gloss" id="rarityGloss"></p>
          <div class="seg" id="raritySeg">
            <button type="button" data-rarity="1">≥ 1</button>
            <button type="button" data-rarity="2" class="on">≥ 2</button>
            <button type="button" data-rarity="6">≥ 6</button>
            <button type="button" data-rarity="0">off</button>
          </div>
        </div>
      </section>

      <p id="expr" class="expr"></p>
      <p id="status" class="status"></p>

      <section id="results" class="results"></section>

      <p class="foot">
        tap a name to copy it · ★ to keep it<br />
        <span id="footRecipe"></span>
      </p>
    </main>

    <div id="rollBar" class="rollbar" hidden>
      <button id="rollBtn" class="roll" type="button">ROLL AGAIN</button>
    </div>

    <!-- author picker sheet -->
    <div id="sheet" class="sheet" hidden>
      <div class="sheet-scrim" data-close></div>
      <div class="sheet-body">
        <div class="sheet-head">
          <strong id="sheetTitle">Authors</strong>
          <button class="ghost" type="button" data-close>done</button>
        </div>

        <div class="tabs" id="pickTabs">
          <button type="button" data-mode="inc" class="on">＋ INCLUDE</button>
          <button type="button" data-mode="exc">− EXCLUDE</button>
        </div>
        <p class="sheet-hint" id="pickHint"></p>

        <div class="summary">
          <div class="summary-row yes">
            <span class="summary-label">＋ INCLUDE</span>
            <div id="sumInc" class="pills"></div>
          </div>
          <div class="summary-row no">
            <span class="summary-label">− EXCLUDE</span>
            <div id="sumExc" class="pills"></div>
          </div>
        </div>

        <div id="chipGroups" class="chip-groups"></div>
      </div>
    </div>

    <!-- kept names sheet -->
    <div id="keptSheet" class="sheet" hidden>
      <div class="sheet-scrim" data-close-kept></div>
      <div class="sheet-body">
        <div class="sheet-head">
          <strong>Kept names</strong>
          <button class="ghost" type="button" data-close-kept>done</button>
        </div>
        <div id="keptList" class="kept-list"></div>
      </div>
    </div>

    <div id="toast" class="toast"></div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
