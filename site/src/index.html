<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0f" />
    <title>Nameforge — invent names from dead authors</title>
    <meta
      name="description"
      content="Pick authors, get names nobody has ever used. Built from 63 classic books plus Lovecraft, Asimov and Philip K. Dick."
    />
    <link rel="stylesheet" href="./style.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔮</text></svg>"
    />
  </head>
  <body>
    <div id="boot" class="boot">
      <div class="boot-mark">✦</div>
      <div class="boot-text">summoning the dead authors…</div>
      <div class="boot-bar"><i></i></div>
    </div>

    <main id="app" hidden>
      <header class="top">
        <h1>NAMEFORGE</h1>
        <button id="keptBtn" class="ghost" type="button">
          ★ <span id="keptCount">0</span>
        </button>
      </header>

      <p id="expr" class="expr"></p>

      <section class="controls">
        <div class="ctl">
          <div class="ctl-label">INCLUDE <span class="muted" id="incGloss"></span></div>
          <div class="seg" id="modeSeg">
            <button type="button" data-mode="all">∩ INTERSECTION</button>
            <button type="button" data-mode="any" class="on">∪ UNION</button>
          </div>
        </div>
        <div class="ctl">
          <div class="ctl-label">
            DIFFERENCE ∖ <span class="muted">common English</span>
          </div>
          <div class="seg" id="raritySeg">
            <button type="button" data-rarity="1" class="on">≥ 1</button>
            <button type="button" data-rarity="2">≥ 2</button>
            <button type="button" data-rarity="6">≥ 6</button>
            <button type="button" data-rarity="0">off</button>
          </div>
          <p class="gloss" id="rarityGloss"></p>
        </div>
      </section>

      <section class="authors">
        <div class="authors-head">
          <span class="ctl-label">AUTHORS</span>
          <span class="key">
            <b class="k-inc">＋</b> include · <b class="k-exc">−</b> exclude ·
            <b class="k-clr">✕</b> clear
          </span>
          <button id="resetBtn" class="reset" type="button">↺ start over</button>
        </div>
        <div id="authorList" class="author-list"></div>
      </section>

      <p id="status" class="status"></p>

      <!-- Evidence first, names second. He reads this to check the working, and
           the working runs recipe -> words it selected -> names built from them.
           Names above the words meant reading the answer before the sum. The
           list is collapsed to a few lines so it cannot bury the names. -->
      <section class="proof proof-top" id="proof">
        <div id="proofBox"></div>
      </section>

      <section id="results" class="results"></section>

      <div id="traceBox" class="trace" hidden></div>

      <p class="foot">
        tap a name to copy it · ★ to keep it<br />
        <span id="footRecipe"></span>
      </p>
    </main>

    <div id="rollBar" class="rollbar" hidden>
      <button id="rollBtn" class="roll" type="button">ROLL AGAIN</button>
    </div>

    <!-- kept names sheet -->
    <div id="keptSheet" class="sheet" hidden>
      <div class="sheet-scrim" data-close-kept></div>
      <div class="sheet-body">
        <div class="sheet-head">
          <strong>Kept names</strong>
          <button class="ghost" type="button" data-close-kept>done</button>
        </div>
        <div id="keptList" class="kept-list"></div>
      </div>
    </div>

    <div id="toast" class="toast"></div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
